<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Content Studio (Grok & Flux)</title>

    <!-- Подключение VK Bridge -->
    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
    <script>
        function initVKBridge() {
            if (window.vkBridge) {
                vkBridge.send('VKWebAppInit')
                    .then(data => console.log('VK Bridge успешно инициализирован:', data))
                    .catch(err => console.error('Ошибка VK Bridge:', err));
            } else {
                setTimeout(initVKBridge, 100);
            }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initVKBridge);
        } else {
            initVKBridge();
        }
    </script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #f8fafc; padding: 20px; display: flex; justify-content: center; }
        .card { background: #1e293b; border-radius: 16px; padding: 30px; width: 100%; max-width: 500px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h1 { font-size: 24px; text-align: center; margin-bottom: 20px; color: #38bdf8; }
        .field { margin-bottom: 18px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px; color: #94a3b8; }
        .mode-toggle { display: flex; background: #0f172a; border-radius: 8px; padding: 4px; gap: 4px; }
        .mode-btn { flex: 1; padding: 10px; border: none; background: transparent; color: #94a3b8; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .mode-btn.active { background: #0284c7; color: white; }
        textarea, select, input[type="text"] { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: white; font-size: 14px; outline: none; }
        textarea { resize: vertical; min-height: 90px; }
        input[type="file"] { display: none; }
        .file-upload-btn { display: block; text-align: center; padding: 10px; background: #334155; color: #e2e8f0; border-radius: 8px; cursor: pointer; font-size: 13px; transition: 0.2s; }
        .file-upload-btn:hover { background: #475569; }
        .preview-img { width: 100%; max-height: 150px; object-fit: cover; border-radius: 8px; margin-top: 10px; display: none; }
        
        /* Стили для блока магазина / пополнения */
        .shop-box { background: #0f172a; border: 1px solid #334155; border-radius: 12px; padding: 15px; margin-bottom: 20px; }
        .shop-title { font-size: 15px; font-weight: bold; color: #38bdf8; margin-bottom: 10px; text-align: center; }
        .shop-grid { display: grid; grid-template-columns: 1fr; gap: 8px; }
        .buy-btn { background: #059669; color: white; border: none; border-radius: 8px; padding: 10px; font-size: 13px; font-weight: bold; cursor: pointer; transition: 0.2s; text-align: center; }
        .buy-btn:hover { background: #047857; }

        .btn-submit { width: 100%; padding: 14px; background: #2563eb; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; margin-top: 10px; }
        .btn-submit:hover { background: #1d4ed8; }
        .btn-submit:disabled { background: #475569; cursor: not-allowed; }
        .result-box { margin-top: 20px; padding: 15px; background: #0f172a; border-radius: 8px; display: none; text-align: center; word-break: break-all; }
        .result-box img, .result-box video { width: 100%; border-radius: 8px; margin-top: 10px; }
        .status-text { font-size: 14px; color: #38bdf8; margin-top: 10px; }
    </style>
</head>
<body>

<div class="card">
    <h1>AI Content Studio</h1>

    <!-- Блок покупки генераций / пакетов -->
    <div class="shop-box">
        <div class="shop-title">💎 Купить генерации</div>
        <div class="shop-grid">
            <button class="buy-btn" onclick="buyItem('photo_1')">1 генерация картинки</button>
            <button class="buy-btn" onclick="buyItem('video_1')">1 генерация видео</button>
            <button class="buy-btn" onclick="buyItem('pack_10_5')" style="background: #7c3aed;">Пакет: 10 картинок + 5 видео 🚀</button>
        </div>
    </div>

    <div class="field">
        <label>Режим генерации:</label>
        <div class="mode-toggle">
            <button class="mode-btn active" onclick="setMode('photo')" id="btn-photo">Фото (Grok)</button>
            <button class="mode-btn" onclick="setMode('video')" id="btn-video">Видео (Grok Imagine)</button>
        </div>
    </div>

    <div class="field">
        <label>Промпт (описание):</label>
        <textarea id="prompt" placeholder="Опиши сцену подробным текстом..."></textarea>
    </div>

    <div class="field">
        <label>Исходное изображение (опционально для Image-to-Image / Video):</label>
        <label for="image-input" class="file-upload-btn" id="upload-label">Выбрать файл изображения</label>
        <input type="file" id="image-input" accept="image/*" onchange="handleFileSelect(event)">
        <img id="image-preview" class="preview-img" alt="Предпросмотр">
    </div>

    <div class="field">
        <label>Соотношение сторон:</label>
        <select id="aspect_ratio">
            <option value="16:9">16:9 (Горизонтальное / YouTube)</option>
            <option value="9:16" selected>9:16 (Вертикальное / Shorts / Reels)</option>
            <option value="1:1">1:1 (Квадрат)</option>
            <option value="4:3">4:3</option>
            <option value="3:4">3:4</option>
        </select>
    </div>

    <div class="field" id="duration-block" style="display: none;">
        <label>Длительность видео (сек):</label>
        <select id="duration">
            <option value="5">5 сек</option>
            <option value="8">8 сек</option>
            <option value="10">10 сек</option>
            <option value="15" selected>15 сек ($0.75)</option>
        </select>
    </div>

    <button class="btn-submit" id="submit-btn" onclick="generate()">Сгенерировать</button>

    <div class="result-box" id="result-box">
        <div class="status-text" id="status-text">Обработка...</div>
        <div id="media-container"></div>
    </div>
</div>

<script>
    const API_BASE_URL = "https://photo-suit-backend.onrender.com";
    let currentMode = "photo";
    let imageBase64 = null;

    function setMode(mode) {
        currentMode = mode;
        document.getElementById("btn-photo").classList.toggle("active", mode === "photo");
        document.getElementById("btn-video").classList.toggle("active", mode === "video");
        document.getElementById("duration-block").style.display = mode === "video" ? "block" : "none";
    }

    function handleFileSelect(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                imageBase64 = e.target.result;
                const preview = document.getElementById("image-preview");
                preview.src = imageBase64;
                preview.style.display = "block";
                document.getElementById("upload-label").innerText = "Файл выбран: " + file.name;
            };
            reader.readAsDataURL(file);
        }
    }

    // Функция вызова официальной оплаты VK
    function buyItem(itemKey) {
        vkBridge.send('VKWebAppShowOrderBox', {
            type: 'item',
            item: itemKey // Убедись, что такие ID созданы в кабинете разработчика VK
        })
        .then((data) => {
            if (data.success) {
                alert("Оплата прошла успешно! Генерации зачислены на ваш баланс.");
                // Здесь можно отправить запрос на свой бэкенд, чтобы начислить баланс юзеру по его VK ID
            }
        })
        .catch((error) => {
            console.error("Ошибка оплаты:", error);
            alert("Оплата была отменена или произошла ошибка.");
        });
    }

    async function generate() {
        const prompt = document.getElementById("prompt").value.trim();
        const aspectRatio = document.getElementById("aspect_ratio").value;
        const duration = parseInt(document.getElementById("duration").value);

        if (!prompt && !imageBase64) {
            alert("Пожалуйста, введите описание или загрузите изображение!");
            return;
        }

        const submitBtn = document.getElementById("submit-btn");
        const resultBox = document.getElementById("result-box");
        const statusText = document.getElementById("status-text");
        const mediaContainer = document.getElementById("media-container");

        submitBtn.disabled = true;
        resultBox.style.display = "block";
        statusText.innerText = "Отправка запроса в Grok...";
        mediaContainer.innerHTML = "";

        const payload = {
            prompt: prompt,
            mode: currentMode,
            aspect_ratio: aspectRatio,
            duration: duration,
            image: imageBase64
        };

        try {
            const response = await fetch(`${API_BASE_URL}/api/generate`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            const data = await response.json();

            if (data.status === "error") {
                statusText.innerText = "Ошибка: " + data.error;
                submitBtn.disabled = false;
                return;
            }

            if (data.status === "success" && data.output_url) {
                statusText.innerText = "Готово!";
                renderMedia(data.output_url);
                submitBtn.disabled = false;
            } else if (data.status === "processing" && data.prediction_id) {
                statusText.innerText = "Генерация видео через Grok Imagine (до 15 сек)...";
                pollStatus(data.prediction_id);
            }
        } catch (err) {
            statusText.innerText = "Ошибка сети: " + err.message;
            submitBtn.disabled = false;
        }
    }

    async function pollStatus(predictionId) {
        const statusText = document.getElementById("status-text");
        const submitBtn = document.getElementById("submit-btn");

        const interval = setInterval(async () => {
            try {
                const res = await fetch(`${API_BASE_URL}/api/status/${predictionId}`);
                const data = await res.json();

                if (data.status === "success") {
                    clearInterval(interval);
                    statusText.innerText = "Видео успешно создано!";
                    renderMedia(data.output_url);
                    submitBtn.disabled = false;
                } else if (data.status === "error") {
                    clearInterval(interval);
                    statusText.innerText = "Ошибка генерации: " + data.error;
                    submitBtn.disabled = false;
                } else {
                    statusText.innerText = "Генерация кадра в процессе (статус: " + (data.progress || "processing") + ")...";
                }
            } catch (e) {
                console.error(e);
            }
        }, 3000);
    }

    function renderMedia(url) {
        const container = document.getElementById("media-container");
        if (currentMode === "photo") {
            container.innerHTML = `<img src="${url}" alt="Сгенерированное фото">`;
        } else {
            container.innerHTML = `<video src="${url}" controls autoplay loop></video>`;
        }
    }
</script>
</body>
</html>
