<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Photo & Video Generator</title>
    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/index.umd.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0f0f12;
            color: #ffffff;
            display: flex;
            justify-content: center;
            padding: 16px;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .header {
            text-align: center;
            padding: 12px 0;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(135deg, #0084ff, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            font-size: 13px;
            color: #8e8e93;
            margin-top: 4px;
        }

        .mode-selector {
            display: flex;
            background: #1c1c1e;
            border-radius: 12px;
            padding: 4px;
            gap: 4px;
        }

        .mode-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            color: #8e8e93;
            font-weight: 600;
            font-size: 14px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .mode-btn.active {
            background: #2c2c2e;
            color: #ffffff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 13px;
            color: #aaa;
            font-weight: 500;
        }

        textarea {
            width: 100%;
            height: 110px;
            background: #1c1c1e;
            border: 1px solid #2c2c2e;
            border-radius: 12px;
            color: #fff;
            padding: 12px;
            font-size: 14px;
            resize: none;
            outline: none;
            transition: border-color 0.2s;
        }

        textarea:focus {
            border-color: #0084ff;
        }

        .btn-generate {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #0084ff, #8a2be2);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 132, 255, 0.3);
            transition: transform 0.1s, opacity 0.2s;
        }

        .btn-generate:active {
            transform: scale(0.98);
        }

        .btn-generate:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .result-box {
            background: #1c1c1e;
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 200px;
            border: 1px dashed #2c2c2e;
        }

        .result-box img, .result-box video {
            width: 100%;
            border-radius: 8px;
            object-fit: cover;
        }

        .loader {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            color: #8e8e93;
            font-size: 14px;
        }

        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid #0084ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .status-msg {
            font-size: 13px;
            color: #8e8e93;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>AI Studio</h1>
            <p>Генерация фото и видео по текстовому описанию</p>
        </div>

        <div class="mode-selector">
            <button class="mode-btn active" id="btn-photo" onclick="setMode('photo')">🖼️ Фото</button>
            <button class="mode-btn" id="btn-video" onclick="setMode('video')">🎬 Видео</button>
        </div>

        <div class="input-group">
            <label for="prompt">Что сгенерировать?</label>
            <textarea id="prompt" placeholder="Например: Cyberpunk car driving through rainy city at night, 8k resolution..."></textarea>
        </div>

        <button class="btn-generate" id="generate-btn" onclick="generateContent()">Создать</button>

        <div class="result-box" id="result-box">
            <div class="status-msg" id="placeholder-text">Результат появится здесь</div>
            <div class="loader" id="loader">
                <div class="spinner"></div>
                <span id="loader-text">Генерируем...</span>
            </div>
            <div id="content-container" style="width: 100%;"></div>
        </div>
    </div>

    <script>
        // Инициализация VK Bridge
        vkBridge.send("VKWebAppInit");

        // Укажи URL своего бэкенда на Render (замени при необходимости)
        const BACKEND_URL = "https://photo-suit-backend.onrender.com/api/process-photo";

        let currentMode = "photo";

        function setMode(mode) {
            currentMode = mode;
            document.getElementById("btn-photo").classList.toggle("active", mode === "photo");
            document.getElementById("btn-video").classList.toggle("active", mode === "video");
        }

        async function generateContent() {
            const promptInput = document.getElementById("prompt");
            const promptText = promptInput.value.trim();

            if (!promptText) {
                alert("Пожалуйста, введите описание!");
                return;
            }

            const btn = document.getElementById("generate-btn");
            const loader = document.getElementById("loader");
            const loaderText = document.getElementById("loader-text");
            const placeholder = document.getElementById("placeholder-text");
            const container = document.getElementById("content-container");

            // Интерфейс в состояние загрузки
            btn.disabled = true;
            placeholder.style.display = "none";
            container.innerHTML = "";
            loader.style.display = "flex";
            loaderText.innerText = currentMode === "video" 
                ? "Генерируем видео (это может занять около 1-2 мин)..." 
                : "Генерируем фото...";

            try {
                const response = await fetch(`${BACKEND_URL}/api/process-photo`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        prompt: promptText,
                        mode: currentMode
                    })
                });

                const data = await response.json();

                if (data.status === "success" && data.output_url) {
                    if (currentMode === "photo") {
                        container.innerHTML = `<img src="${data.output_url}" alt="Generated Photo">`;
                    } else {
                        container.innerHTML = `
                            <video controls autoplay loop style="width:100%;">
                                <source src="${data.output_url}" type="video/mp4">
                                Ваш браузер не поддерживает видео.
                            </video>`;
                    }
                } else {
                    alert("Ошибка: " + (data.error || "Не удалось сгенерировать"));
                    placeholder.style.display = "block";
                }
            } catch (err) {
                console.error(err);
                alert(" Ошибка сети или сервиса. Проверьте консоль.");
                placeholder.style.display = "block";
            } finally {
                loader.style.display = "none";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
