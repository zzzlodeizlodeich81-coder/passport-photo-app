<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Content Studio</title>
    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/index.umd.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background-color: #0f0f12; color: #ffffff; display: flex; justify-content: center; padding: 16px; min-height: 100vh; }
        .container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 16px; }
        .header { text-align: center; padding: 8px 0; }
        .header h1 { font-size: 24px; font-weight: 700; background: linear-gradient(135deg, #0084ff, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header p { font-size: 13px; color: #8e8e93; margin-top: 4px; }
        
        .section-label { font-size: 12px; color: #8e8e93; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }

        .mode-selector, .ratio-selector { display: flex; background: #1c1c1e; border-radius: 12px; padding: 4px; gap: 4px; }
        .mode-btn, .ratio-btn { flex: 1; padding: 10px; border: none; background: transparent; color: #8e8e93; font-weight: 600; font-size: 13px; border-radius: 8px; cursor: pointer; transition: all 0.2s; }
        .mode-btn.active, .ratio-btn.active { background: #2c2c2e; color: #ffffff; box-shadow: 0 2px 8px rgba(0,0,0,0.4); }

        .input-group { display: flex; flex-direction: column; gap: 8px; }
        textarea { width: 100%; height: 90px; background: #1c1c1e; border: 1px solid #2c2c2e; border-radius: 12px; color: #fff; padding: 12px; font-size: 14px; resize: none; outline: none; }
        textarea:focus { border-color: #0084ff; }

        .btn-generate { width: 100%; padding: 15px; border: none; border-radius: 12px; background: linear-gradient(135deg, #0084ff, #8a2be2); color: white; font-size: 16px; font-weight: 600; cursor: pointer; }
        .btn-generate:disabled { opacity: 0.5; cursor: not-allowed; }

        .result-box { background: #1c1c1e; border-radius: 12px; padding: 12px; min-height: 220px; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 1px dashed #2c2c2e; }
        .result-box img, .result-box video { width: 100%; border-radius: 8px; max-height: 500px; object-fit: contain; }

        .loader { display: none; flex-direction: column; align-items: center; gap: 12px; color: #8e8e93; font-size: 14px; text-align: center; }
        .spinner { width: 36px; height: 36px; border: 3px solid rgba(255,255,255,0.1); border-top: 3px solid #0084ff; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>AI Content Studio</h1>
            <p>Генерация фото и видео по тексту</p>
        </div>

        <!-- Выбор Режима -->
        <div class="input-group">
            <span class="section-label">Режим генерации</span>
            <div class="mode-selector">
                <button class="mode-btn active" id="btn-photo">🖼️ Фото</button>
                <button class="mode-btn" id="btn-video">🎬 Видео</button>
            </div>
        </div>

        <!-- Выбор Формата (Aspect Ratio) -->
        <div class="input-group">
            <span class="section-label">Формат кадра</span>
            <div class="ratio-selector">
                <button class="ratio-btn active" onclick="setRatio('16:9')">16:9 (YouTube)</button>
                <button class="ratio-btn" onclick="setRatio('9:16')">9:16 (Reels/VK)</button>
                <button class="ratio-btn" onclick="setRatio('1:1')">1:1 (Квадрат)</button>
                <button class="ratio-btn" onclick="setRatio('3:4')">3:4 (Портрет)</button>
            </div>
        </div>

        <!-- Промпт -->
        <div class="input-group">
            <span class="section-label">Описание сцены</span>
            <textarea id="prompt" placeholder="Опишите желаемый кадр..."></textarea>
        </div>

        <button class="btn-generate" id="generate-btn">Сгенерировать</button>

        <div class="result-box">
            <div id="placeholder" style="color:#666; font-size:14px;">Здесь появится результат</div>
            <div class="loader" id="loader">
                <div class="spinner"></div>
                <span id="loader-text">Генерируем...</span>
            </div>
            <div id="content-container" style="width: 100%; display: flex; justify-content: center;"></div>
        </div>
    </div>

    <script>
        try { vkBridge.send("VKWebAppInit"); } catch (e) {}

        const BACKEND_URL = "https://photo-suit-backend.onrender.com";
        let currentMode = "photo";
        let currentRatio = "16:9";

        const btnPhoto = document.getElementById("btn-photo");
        const btnVideo = document.getElementById("btn-video");
        const generateBtn = document.getElementById("generate-btn");
        const promptInput = document.getElementById("prompt");
        const loader = document.getElementById("loader");
        const loaderText = document.getElementById("loader-text");
        const placeholder = document.getElementById("placeholder");
        const container = document.getElementById("content-container");

        function setRatio(ratio) {
            currentRatio = ratio;
            document.querySelectorAll('.ratio-btn').forEach(btn => {
                btn.classList.toggle('active', btn.innerText.includes(ratio));
            });
        }

        btnPhoto.addEventListener("click", () => {
            currentMode = "photo";
            btnPhoto.classList.add("active");
            btnVideo.classList.remove("active");
        });

        btnVideo.addEventListener("click", () => {
            currentMode = "video";
            btnVideo.classList.add("active");
            btnPhoto.classList.remove("active");
        });

        generateBtn.addEventListener("click", async () => {
            const text = promptInput.value.trim();
            if (!text) {
                alert("Введите текст промпта!");
                return;
            }

            generateBtn.disabled = true;
            placeholder.style.display = "none";
            container.innerHTML = "";
            loader.style.display = "flex";
            
            loaderText.innerText = currentMode === "video" 
                ? "Генерация видео (~1-2 минуты)..." 
                : "Генерируем фото...";

            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 180000);

                const response = await fetch(`${BACKEND_URL}/api/generate`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    signal: controller.signal,
                    body: JSON.stringify({
                        prompt: text,
                        mode: currentMode,
                        aspect_ratio: currentRatio
                    })
                });

                clearTimeout(timeoutId);
                const data = await response.json();

                if (data.status === "success" && data.output_url) {
                    if (currentMode === "photo") {
                        container.innerHTML = `<img src="${data.output_url}" alt="Result">`;
                    } else {
                        container.innerHTML = `
                            <video controls autoplay loop style="width:100%;">
                                <source src="${data.output_url}" type="video/mp4">
                            </video>`;
                    }
                } else {
                    alert("Ошибка: " + (data.error || "Пустой ответ от сервера"));
                    placeholder.style.display = "block";
                }
            } catch (err) {
                alert("Ошибка сети или таймаут генерации.");
                placeholder.style.display = "block";
            } finally {
                loader.style.display = "none";
                generateBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
