<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AI Content Studio</title>
    <!-- Официальный скрипт VK Bridge -->
    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #121213;
            color: #ffffff;
            margin: 0;
            padding: 15px;
            padding-bottom: 70px;
            box-sizing: border-box;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            font-size: 22px;
            margin-bottom: 15px;
            color: #2688eb;
        }

        /* Виджет баланса */
        .balance-card {
            background: #1e1e20;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .balance-val {
            font-size: 18px;
            font-weight: bold;
            color: #4bb34b;
        }

        .buy-btn {
            background: #2688eb;
            color: #fff;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Форма управления */
        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #aaa;
        }

        select, textarea, input[type="file"] {
            width: 100%;
            background: #1e1e20;
            border: 1px solid #333;
            color: #fff;
            padding: 10px;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
        }

        textarea {
            height: 80px;
            resize: none;
        }

        .btn-generate {
            width: 100%;
            background: #4bb34b;
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-generate:disabled {
            background: #444;
            cursor: not-allowed;
        }

        /* Ценник под кнопкой */
        .cost-info {
            text-align: center;
            font-size: 12px;
            color: #888;
            margin-top: 6px;
        }

        /* Результат */
        #result-container {
            margin-top: 20px;
            text-align: center;
        }

        /* Модалка покупки кадров */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 999;
        }

        .modal-content {
            background: #1e1e20;
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            max-width: 350px;
        }

        .tariff-item {
            background: #2a2a2d;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        /* Плавающее уведомление вместо alert */
        #toast-notification {
            display: none;
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #2688eb;
            color: #fff;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            z-index: 9999;
            text-align: center;
            max-width: 90%;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>AI Content Studio</h1>

    <!-- Плашка баланса -->
    <div class="balance-card">
        <div>Ваш баланс: <span id="balance-val" class="balance-val">0</span> кадров</div>
        <button class="buy-btn" onclick="openBuyModal()">Пополнить</button>
    </div>

    <!-- Режим -->
    <div class="form-group">
        <label>Режим генерации:</label>
        <select id="mode-select" onchange="updatePriceDisplay()">
            <option value="photo">Картинка (xAI Grok Image)</option>
            <option value="video">Видео (xAI Grok Video)</option>
        </select>
    </div>

    <!-- Длительность (для видео) -->
    <div class="form-group" id="duration-group" style="display: none;">
        <label>Длительность видео:</label>
        <select id="duration-select" onchange="updatePriceDisplay()">
            <option value="5">5 секунд</option>
            <option value="10">10 секунд</option>
            <option value="15">15 секунд</option>
        </select>
    </div>

    <!-- Промпт -->
    <div class="form-group">
        <label>Промпт (Описание):</label>
        <textarea id="prompt-input" placeholder="Опишите желаемый результат..."></textarea>
    </div>

    <!-- Соотношение сторон -->
    <div class="form-group">
        <label>Формат (Соотношение сторон):</label>
        <select id="ratio-select">
            <option value="9:16">9:16 (Вертикальное / Reels / Stories)</option>
            <option value="16:9">16:9 (Горизонтальное)</option>
            <option value="1:1">1:1 (Квадрат)</option>
        </select>
    </div>

    <!-- Исходное фото (Image-to-Image) -->
    <div class="form-group">
        <label>Исходное фото (опционально):</label>
        <input type="file" id="image-file" accept="image/*">
    </div>

    <!-- Кнопка генерации -->
    <button id="generate-btn" class="btn-generate" onclick="startGeneration()">Сгенерировать</button>
    <div id="cost-info" class="cost-info">Стоимость: 40 кадров</div>

    <!-- Результат -->
    <div id="result-container">
        <div id="status-text"></div>
        <img id="result-img" style="display:none; max-width:100%; border-radius:10px; margin-top:10px;">
        <video id="result-video" controls style="display:none; max-width:100%; border-radius:10px; margin-top:10px;"></video>
    </div>
</div>

<!-- Модальное окно покупки кадров -->
<div id="buy-modal" class="modal">
    <div class="modal-content">
        <h3 style="margin-top:0;">Пополнение баланса</h3>
        
        <div class="tariff-item" onclick="buyVotes('votes_2')">
            <span>40 кадров (1 фото) — 2 голоса</span>
            <button class="buy-btn">Купить</button>
        </div>
        <div class="tariff-item" onclick="buyVotes('votes_6')">
            <span>120 кадров (видео 5с) — 6 голосов</span>
            <button class="buy-btn">Купить</button>
        </div>
        <div class="tariff-item" onclick="buyVotes('votes_11')">
            <span>220 кадров (видео 10с) — 11 голосов</span>
            <button class="buy-btn">Купить</button>
        </div>
        <div class="tariff-item" onclick="buyVotes('votes_16')">
            <span>320 кадров (видео 15с) — 16 голосов</span>
            <button class="buy-btn">Купить</button>
        </div>
        <div class="tariff-item" onclick="buyVotes('votes_30')">
            <span>600 кадров (Выгодно!) — 30 голосов</span>
            <button class="buy-btn">Купить</button>
        </div>

        <button onclick="closeBuyModal()" style="width:100%; margin-top:15px; padding:10px; background:#444; color:#fff; border:none; border-radius:8px; cursor:pointer;">Закрыть</button>
    </div>
</div>

<!-- Красивый тост вместо браузерных alert -->
<div id="toast-notification"></div>

<script>
    const BACKEND_URL = "https://photo-suit-backend.onrender.com";
    let vkUserId = null;

    function showToast(message, isError = false) {
        const toast = document.getElementById('toast-notification');
        toast.style.background = isError ? '#e64a19' : '#2688eb';
        toast.innerText = message;
        toast.style.display = 'block';
        setTimeout(() => {
            toast.style.display = 'none';
        }, 3500);
    }

   async function initVK() {
    try {
        // Пробуем достать viewer_id из параметров ссылки (их всегда передает ВК)
        const urlParams = new URLSearchParams(window.location.search);
        let vk_user = urlParams.get('vk_viewer_id') || urlParams.get('viewer_id');

        if (!vk_user && typeof vkBridge !== 'undefined') {
            // Если в урле нет, пробуем через init-параметры bridge
            const initData = await vkBridge.send('VKWebAppGetInitData');
            vk_user = initData.viewer_id;
        }

        if (vk_user) {
            vkUserId = String(vk_user);
            console.log("Успешно получен ID пользователя:", vkUserId);
            refreshBalance();
        } else {
            // Запасной вариант через GetUserInfo, если параметры не поймались
            const user = await vkBridge.send('VKWebAppGetUserInfo');
            vkUserId = String(user.id);
            refreshBalance();
        }
    } catch (err) {
        console.error("Ошибка инициализации VK:", err);
        vkUserId = "test_user_123";
        refreshBalance();
    }
}

    document.addEventListener("DOMContentLoaded", initVK);

    function updatePriceDisplay() {
        const mode = document.getElementById('mode-select').value;
        const durationGroup = document.getElementById('duration-group');
        const costInfo = document.getElementById('cost-info');

        if (mode === 'video') {
            durationGroup.style.display = 'block';
            const dur = document.getElementById('duration-select').value;
            let cost = 120;
            if (dur === '10') cost = 220;
            if (dur === '15') cost = 320;
            costInfo.innerText = `Стоимость: ${cost} кадров`;
        } else {
            durationGroup.style.display = 'none';
            costInfo.innerText = `Стоимость: 40 кадров`;
        }
    }

    function refreshBalance() {
        if (!vkUserId) return;
        fetch(`${BACKEND_URL}/api/balance/${vkUserId}`)
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    document.getElementById('balance-val').innerText = data.balance;
                }
            })
            .catch(err => console.error(err));
    }

    function buyVotes(itemKey) {
        if (typeof vkBridge === 'undefined') {
            showToast("Покупка доступна только внутри ВКонтакте!", true);
            return;
        }

        vkBridge.send('VKWebAppShowOrderBox', {
            type: 'item',
            item: itemKey
        }).then(data => {
            if (data.success) {
                setTimeout(refreshBalance, 1500);
                closeBuyModal();
                showToast("Оплата прошла успешно!");
            }
        }).catch(err => console.error("Ошибка VK Pay:", err));
    }

    function openBuyModal() { document.getElementById('buy-modal').style.display = 'flex'; }
    function closeBuyModal() { document.getElementById('buy-modal').style.display = 'none'; }

    function fileToBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });
    }

    async function startGeneration() {
        if (!vkUserId) {
            showToast("Ошибка: не определён ID пользователя.", true);
            return;
        }

        const mode = document.getElementById('mode-select').value;
        const duration = parseInt(document.getElementById('duration-select').value);
        const prompt = document.getElementById('prompt-input').value;
        const ratio = document.getElementById('ratio-select').value;
        const fileInput = document.getElementById('image-file');

        let imageBase64 = null;
        if (fileInput.files.length > 0) {
            imageBase64 = await fileToBase64(fileInput.files[0]);
        }

        const statusText = document.getElementById('status-text');
        const btn = document.getElementById('generate-btn');
        const imgRes = document.getElementById('result-img');
        const videoRes = document.getElementById('result-video');

        btn.disabled = true;
        statusText.innerText = "Запуск генерации...";
        imgRes.style.display = "none";
        videoRes.style.display = "none";

        const payload = {
            user_id: vkUserId,
            prompt: prompt,
            mode: mode,
            aspect_ratio: ratio,
            duration: duration,
            image: imageBase64
        };

        try {
            const res = await fetch(`${BACKEND_URL}/api/generate`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            const data = await res.json();

            if (data.status === 'error') {
                statusText.innerText = "Ошибка: " + data.error;
                showToast(data.error, true);
                btn.disabled = false;
                return;
            }

            refreshBalance();

            if (data.mode === 'photo') {
                imgRes.src = data.output_url;
                imgRes.style.display = "block";
                statusText.innerText = "Готово!";
                btn.disabled = false;
            } else if (data.mode === 'video') {
                statusText.innerText = "Видео генерируется, подождите...";
                pollVideoStatus(data.prediction_id);
            }

        } catch (e) {
            statusText.innerText = "Ошибка сервера: " + e.message;
            showToast("Ошибка сервера: " + e.message, true);
            btn.disabled = false;
        }
    }

    function pollVideoStatus(predictionId) {
        const interval = setInterval(async () => {
            try {
                const res = await fetch(`${BACKEND_URL}/api/status/${predictionId}`);
                const data = await res.json();

                if (data.status === 'success') {
                    clearInterval(interval);
                    const videoRes = document.getElementById('result-video');
                    videoRes.src = data.output_url;
                    videoRes.style.display = "block";
                    document.getElementById('status-text').innerText = "Готово!";
                    document.getElementById('generate-btn').disabled = false;
                } else if (data.status === 'error') {
                    clearInterval(interval);
                    document.getElementById('status-text').innerText = "Ошибка генерации: " + data.error;
                    showToast("Ошибка генерации: " + data.error, true);
                    document.getElementById('generate-btn').disabled = false;
                }
            } catch (e) {
                console.error(e);
            }
        }, 3000);
    }
</script>

</body>
</html>
