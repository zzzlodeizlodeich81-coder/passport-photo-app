<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Content Studio</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: #1e293b;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 600px;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 20px;
      text-align: center;
      color: #38bdf8;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #94a3b8;
    }

    textarea, select {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    textarea:focus, select:focus {
      border-color: #38bdf8;
    }

    .radio-group {
      display: flex;
      gap: 10px;
    }

    .radio-btn {
      flex: 1;
      text-align: center;
      padding: 10px;
      border: 1px solid #334155;
      border-radius: 8px;
      cursor: pointer;
      background: #0f172a;
      transition: all 0.2s;
      font-size: 14px;
    }

    .radio-btn input {
      display: none;
    }

    .radio-btn.active {
      background: #0284c7;
      border-color: #38bdf8;
      color: #fff;
      font-weight: bold;
    }

    button.btn-submit {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #0284c7, #2563eb);
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button.btn-submit:hover {
      opacity: 0.9;
    }

    button.btn-submit:disabled {
      background: #475569;
      cursor: not-allowed;
    }

    .result-box {
      margin-top: 25px;
      padding: 15px;
      border-radius: 12px;
      background: #0f172a;
      text-align: center;
      display: none;
    }

    .result-box img, .result-box video {
      max-width: 100%;
      border-radius: 8px;
      margin-top: 10px;
    }

    .loader {
      display: inline-block;
      width: 24px;
      height: 24px;
      border: 3px solid rgba(255,255,255,.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 1s ease-in-out infinite;
      vertical-align: middle;
      margin-right: 8px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

<div class="container">
  <h1>AI Content Studio</h1>

  <div class="form-group">
    <label>Режим генерации:</label>
    <div class="radio-group" id="modeGroup">
      <label class="radio-btn active">
        <input type="radio" name="mode" value="photo" checked onchange="toggleVideoOptions()"> Фото (Flux)
      </label>
      <label class="radio-btn">
        <input type="radio" name="mode" value="video" onchange="toggleVideoOptions()"> Видео (Runway Gen-4)
      </label>
    </div>
  </div>

  <div class="form-group">
    <label for="prompt">Промпт (описание):</label>
    <textarea id="prompt" placeholder="Опишите сцену на английском языке..."></textarea>
  </div>

  <div class="form-group">
    <label for="aspectRatio">Соотношение сторон:</label>
    <select id="aspectRatio">
      <option value="16:9">16:9 (Широкоформатное)</option>
      <option value="9:16">9:16 (Вертикальное / Shorts / Reels)</option>
      <option value="1:1">1:1 (Квадрат)</option>
      <option value="4:3">4:3 (Стандарт)</option>
    </select>
  </div>

  <!-- Опция длительности (отображается только для видео) -->
  <div class="form-group" id="durationGroup" style="display: none;">
    <label>Длительность видео:</label>
    <div class="radio-group">
      <label class="radio-btn active" onclick="selectDuration(this)">
        <input type="radio" name="duration" value="5" checked> 5 сек ($0.25)
      </label>
      <label class="radio-btn" onclick="selectDuration(this)">
        <input type="radio" name="duration" value="10"> 10 сек ($0.50)
      </label>
    </div>
  </div>

  <button class="btn-submit" id="generateBtn" onclick="generateContent()">Сгенерировать</button>

  <div class="result-box" id="resultBox">
    <div id="statusMessage"></div>
    <div id="mediaContainer"></div>
  </div>
</div>

<script>
  // Замени эту строку:
const API_BASE_URL = "https://photo-suit-backend.onrender.com"; 

  // Переключение UI-классов для кнопок режима
  document.querySelectorAll('#modeGroup .radio-btn').forEach(btn => {
    btn.addEventListener('click', function() {
      document.querySelectorAll('#modeGroup .radio-btn').forEach(b => b.classList.remove('active'));
      this.classList.add('active');
    });
  });

  function selectDuration(element) {
    element.parentElement.querySelectorAll('.radio-btn').forEach(b => b.classList.remove('active'));
    element.classList.add('active');
  }

  function toggleVideoOptions() {
    const mode = document.querySelector('input[name="mode"]:checked').value;
    const durationGroup = document.getElementById('durationGroup');
    if (mode === 'video') {
      durationGroup.style.display = 'block';
    } else {
      durationGroup.style.display = 'none';
    }
  }

  async function generateContent() {
    const prompt = document.getElementById('prompt').value.trim();
    const mode = document.querySelector('input[name="mode"]:checked').value;
    const aspectRatio = document.getElementById('aspectRatio').value;
    const duration = parseInt(document.querySelector('input[name="duration"]:checked').value);

    const generateBtn = document.getElementById('generateBtn');
    const resultBox = document.getElementById('resultBox');
    const statusMessage = document.getElementById('statusMessage');
    const mediaContainer = document.getElementById('mediaContainer');

    if (!prompt) {
      alert("Пожалуйста, введите промпт!");
      return;
    }

    generateBtn.disabled = true;
    resultBox.style.display = 'block';
    mediaContainer.innerHTML = '';
    statusMessage.innerHTML = '<span class="loader"></span> Отправка запроса...';

    try {
      const response = await fetch(`${API_BASE_URL}/api/generate`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          prompt: prompt,
          mode: mode,
          aspect_ratio: aspectRatio,
          duration: duration
        })
      });

      const data = await response.json();

      if (data.status === 'error') {
        throw new Error(data.error);
      }

      if (data.mode === 'photo') {
        statusMessage.innerText = 'Готово!';
        mediaContainer.innerHTML = `<img src="${data.output_url}" alt="Generated Image">`;
        generateBtn.disabled = false;
      } else if (data.mode === 'video') {
        statusMessage.innerHTML = `<span class="loader"></span> Генерация видео (Runway Gen-4, ${duration} сек)... Это займет ~20-30 сек.`;
        pollVideoStatus(data.prediction_id);
      }

    } catch (err) {
      statusMessage.innerText = `Ошибка: ${err.message}`;
      generateBtn.disabled = false;
    }
  }

  async function pollVideoStatus(predictionId) {
    const statusMessage = document.getElementById('statusMessage');
    const mediaContainer = document.getElementById('mediaContainer');
    const generateBtn = document.getElementById('generateBtn');

    const interval = setInterval(async () => {
      try {
        const res = await fetch(`${API_BASE_URL}/api/status/${predictionId}`);
        const data = await res.json();

        if (data.status === 'success') {
          clearInterval(interval);
          statusMessage.innerText = 'Видео успешно сгенерировано!';
          mediaContainer.innerHTML = `
            <video controls autoplay loop>
              <source src="${data.output_url}" type="video/mp4">
              Ваш браузер не поддерживает видео.
            </video>
          `;
          generateBtn.disabled = false;
        } else if (data.status === 'error') {
          clearInterval(interval);
          statusMessage.innerText = `Ошибка генерации: ${data.error}`;
          generateBtn.disabled = false;
        }
      } catch (err) {
        clearInterval(interval);
        statusMessage.innerText = `Ошибка проверки статуса: ${err.message}`;
        generateBtn.disabled = false;
      }
    }, 4000); // Проверяем статус каждые 4 секунды
  }
</script>

</body>
</html>
